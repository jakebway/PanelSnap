name: PanelSnap
options:
  bundleIdPrefix: com.jakebway
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
  Unrar:
    url: https://github.com/mtgto/Unrar.swift
    exactVersion: 0.5.4
  SevenZip:
    url: https://github.com/mtgto/SevenZip.swift
    exactVersion: 0.5.0
targets:
  PanelSnap:
    type: application
    platform: iOS
    sources:
      - path: PanelSnap
        excludes:
          - Info.plist
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: Unrar
        product: Unrar
      - package: SevenZip
        product: SevenZip
    settings:
      base:
        PRODUCT_NAME: PanelSnap
        PRODUCT_BUNDLE_IDENTIFIER: com.jakebway.panelsnap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_PREVIEWS: "NO"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
        GCC_TREAT_WARNINGS_AS_ERRORS: "NO"
    info:
      path: PanelSnap/Info.plist
      properties:
        CFBundleDisplayName: PanelSnap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.jakebway.panelsnap.cbz
              - com.jakebway.panelsnap.cbr
              - com.jakebway.panelsnap.cb7
              - com.adobe.pdf
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.jakebway.panelsnap.cbz
            UTTypeDescription: Comic Book Archive (ZIP)
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
          - UTTypeIdentifier: com.jakebway.panelsnap.cbr
            UTTypeDescription: Comic Book Archive (RAR)
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbr
          - UTTypeIdentifier: com.jakebway.panelsnap.cb7
            UTTypeDescription: Comic Book Archive (7z)
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cb7
